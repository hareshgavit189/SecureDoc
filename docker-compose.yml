version: '3.8'

services:
  # SecureDoc DMS Application Service (Unified Web App)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: securedoc_app
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/legal_dms?authSource=admin
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - MASTER_KEY_HEX=${MASTER_KEY_HEX}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN}
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE:-lax}
    depends_on:
      mongo:
        condition: service_healthy

  # Local MongoDB Service with Persistent Volume
  mongo:
    image: mongo:7.0
    container_name: securedoc_db
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
    driver: local
