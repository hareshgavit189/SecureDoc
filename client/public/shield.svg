<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Shield Trim -->
  <path d="M32 3 L55 12 C55 35 43 51 32 60 C21 51 9 35 9 12 Z" 
        fill="url(#goldGrad)" />

  <!-- Inner Dark Shield Body -->
  <path d="M32 6 L52 14 C52 34 41 48 32 56 C23 48 12 34 12 14 Z" 
        fill="url(#shieldGrad)" />

  <!-- Tricolor Accent Bands (Top Interior) -->
  <path d="M22 17 L42 17 C41 19 39 21 32 21 C25 21 23 19 22 17 Z" fill="#ff9933" opacity="0.9" />
  <path d="M24 22 L40 22 C38 24 35 25 32 25 C29 25 26 24 24 22 Z" fill="#138808" opacity="0.9" />

  <!-- Cryptographic Padlock / Evidence Seal -->
  <!-- Shackle -->
  <path d="M26 34 L26 29 C26 25.686 28.686 23 32 23 C35.314 23 38 25.686 38 29 L38 34" 
        fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Lock Body -->
  <rect x="23" y="33" width="18" height="15" rx="3.5" fill="url(#accentGrad)" filter="url(#glow)" />

  <!-- Keyhole -->
  <circle cx="32" cy="39" r="2.2" fill="#0f172a" />
  <path d="M31 39.5 L33 39.5 L33.5 44 L30.5 44 Z" fill="#0f172a" />

  <!-- Subtle Verification Star -->
  <polygon points="32,7 33.2,10 36.5,10 33.8,11.8 34.8,15 32,13.2 29.2,15 30.2,11.8 27.5,10 30.8,10" 
           fill="#ffffff" opacity="0.85" />
</svg>
