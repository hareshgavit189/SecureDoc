name: SecureDoc CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Start test API
        env:
          NODE_ENV: test
          PORT: 5000
          MONGO_URI: mongodb://127.0.0.1:27017/securedoc_ci
          JWT_ACCESS_SECRET: ci-access-secret-012345678901234567890123
          JWT_REFRESH_SECRET: ci-refresh-secret-012345678901234567890123
          MASTER_KEY_HEX: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          CLIENT_ORIGIN: http://localhost:5173
        run: |
          npm run seed:demo --prefix server
          nohup npm start --prefix server > /tmp/securedoc-server.log 2>&1 &
          for i in {1..30}; do curl --fail http://127.0.0.1:5000/health && exit 0; sleep 1; done
          cat /tmp/securedoc-server.log
          exit 1

      - name: Lint
        run: npm run lint

      - name: Test API
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/securedoc_ci
        run: npm test

      - name: Build client
        run: npm run build

      - name: Audit production dependencies
        run: |
          npm audit --prefix server --omit=dev --audit-level=high
          npm audit --prefix client --omit=dev --audit-level=high
